<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <style>
        .admin-sidebar {
            background-color: var(--primary);
            min-height: 100vh;
        }
        .admin-sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
        }
        .admin-sidebar .nav-link:hover,
        .admin-sidebar .nav-link.active {
            color: white;
            background-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 admin-sidebar p-0">
                <div class="d-flex flex-column p-3">
                    <h4 class="text-white mb-4" style="font-family: 'Playfair Display', serif;">
                        <i class="fas fa-book-open me-2"></i>Admin
                    </h4>
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item">
                            <a th:href="@{/admin/dashboard}" class="nav-link">
                                <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/admin/books}" class="nav-link">
                                <i class="fas fa-book me-2"></i>Books
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/admin/categories}" class="nav-link">
                                <i class="fas fa-layer-group me-2"></i>Categories
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/admin/orders}" class="nav-link">
                                <i class="fas fa-shopping-bag me-2"></i>Orders
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/admin/reviews}" class="nav-link active">
                                <i class="fas fa-star me-2"></i>Reviews
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/}" class="nav-link">
                                <i class="fas fa-home me-2"></i>Back to Site
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold" style="font-family: 'Playfair Display', serif;">Pending Reviews</h2>
                </div>

                <div th:if="${reviews.empty}" class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>No pending reviews to approve.
                </div>

                <div class="row" th:if="${!reviews.empty}">
                    <div class="col-lg-6 mb-4" th:each="review : ${reviews}">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div>
                                        <h6 class="fw-bold" th:text="${review.user.firstName} + ' ' + ${review.user.lastName}"></h6>
                                        <p class="text-muted small mb-0" th:text="${review.user.email}"></p>
                                    </div>
                                    <div class="rating">
                                        <i class="fas fa-star"></i>
                                        <span th:text="${review.rating}"></span>
                                    </div>
                                </div>
                                <p class="mb-2"><strong>Book:</strong> <span th:text="${review.book.title}"></span></p>
                                <p class="mb-3" th:text="${review.comment}"></p>
                                <p class="text-muted small mb-3">
                                    <i class="fas fa-calendar me-1"></i>
                                    <span th:text="${#temporals.format(review.createdAt, 'MMM dd, yyyy')}"></span>
                                </p>
                                <form th:action="@{/admin/reviews/{id}/approve(id=${review.id})}" method="post">
                                    <button type="submit" class="btn btn-success btn-sm">
                                        <i class="fas fa-check me-1"></i>Approve Review
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
