<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-lg-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/profile}">Profile</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Addresses</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="text-center mb-5" data-aos="fade-up">
            <h1 class="section-title">My Addresses</h1>
            <p class="text-muted">Manage your delivery addresses</p>
        </div>

        <div class="row mb-4">
            <div class="col-lg-12">
                <a th:href="@{/profile/address/add}" class="btn btn-primary">
                    <i class="fas fa-plus me-2"></i>Add New Address
                </a>
            </div>
        </div>

        <div th:if="${addresses == null or addresses.empty}">
            <div class="text-center py-5" data-aos="fade-up">
                <i class="fas fa-map-marker-alt fa-4x text-muted mb-3"></i>
                <h4>No addresses saved</h4>
                <p class="text-muted">Add a delivery address for faster checkout</p>
                <a th:href="@{/profile/address/add}" class="btn btn-primary">
                    <i class="fas fa-plus me-2"></i>Add Address
                </a>
            </div>
        </div>

        <div class="row g-4" th:if="${addresses != null and !addresses.empty}">
            <div class="col-lg-4 col-md-6" th:each="address : ${addresses}" data-aos="fade-up">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h6 class="fw-bold mb-0">
                                <i class="fas fa-home me-2"></i>
                                <span th:if="${address.defaultAddress}" class="badge bg-primary">Default</span>
                            </h6>
                        </div>
                        <p class="mb-2" th:text="${address.addressLine1}"></p>
                        <p class="mb-2" th:if="${address.addressLine2 != null}" th:text="${address.addressLine2}"></p>
                        <p class="mb-2" th:text="${address.city + ', ' + address.state}"></p>
                        <p class="mb-2" th:text="${address.postalCode}"></p>
                        <p class="mb-2" th:if="${address.country != null}" th:text="${address.country}"></p>
                        <p class="mb-0 text-muted" th:if="${address.phone != null}" th:text="'Phone: ' + ${address.phone}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
    </script>
</body>
</html>
