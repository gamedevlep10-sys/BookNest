<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container flex-grow-1">
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="col-lg-5 col-md-7" data-aos="fade-up">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="mb-3">
                                <a class="navbar-brand text-decoration-none d-inline-block" th:href="@{/}" th:replace="~{fragments/header :: logo}">
                                    <i class="fas fa-book-open me-2"></i>BookNest
                                </a>
                            </div>
                            <h2 class="fw-bold" style="font-family: 'Playfair Display', serif; color: var(--primary);">
                                Welcome Back
                            </h2>
                            <p class="text-muted">Login to your BookNest account</p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                        </div>

                        <div th:if="${message}" class="alert alert-success" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${message}"></span>
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i class="fas fa-envelope" style="color: var(--primary);"></i>
                                    </span>
                                    <input type="email" class="form-control" id="email" name="username" 
                                           placeholder="Enter your email" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i class="fas fa-lock" style="color: var(--primary);"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password" name="password" 
                                           placeholder="Enter your password" required>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">
                                Login
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">
                                Don't have an account? 
                                <a th:href="@{/register}" style="color: var(--primary);">Register here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
    </script>
</body>
</html>
