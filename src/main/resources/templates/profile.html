<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-lg-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Profile</li>
                    </ol>
                </div>
            </div>
        </div>

        <div class="row" data-aos="fade-up">
            <div class="col-lg-4 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <i class="fas fa-user-circle fa-5x" style="color: var(--primary);"></i>
                        </div>
                        <h4 class="fw-bold" th:text="${user.firstName} + ' ' + ${user.lastName}"></h4>
                        <p class="text-muted" th:text="${user.email}"></p>
                        <p class="text-muted" th:if="${user.phone != null}" th:text="${user.phone}"></p>
                        <hr>
                        <div class="text-start">
                            <a th:href="@{/profile}" class="btn btn-outline-primary w-100 mb-2 active">
                                <i class="fas fa-user me-2"></i>Profile
                            </a>
                            <a th:href="@{/profile/orders}" class="btn btn-outline-primary w-100 mb-2">
                                <i class="fas fa-shopping-bag me-2"></i>Orders
                            </a>
                            <a th:href="@{/profile/addresses}" class="btn btn-outline-primary w-100 mb-2">
                                <i class="fas fa-map-marker-alt me-2"></i>Addresses
                            </a>
                            <a th:href="@{/profile/reviews}" class="btn btn-outline-primary w-100 mb-2">
                                <i class="fas fa-star me-2"></i>Reviews
                            </a>
                            <a th:href="@{/wishlist}" class="btn btn-outline-primary w-100 mb-2">
                                <i class="fas fa-heart me-2"></i>Wishlist
                            </a>
                            <a th:href="@{/cart}" class="btn btn-outline-primary w-100 mb-2">
                                <i class="fas fa-shopping-cart me-2"></i>Cart
                            </a>
                            <a th:href="@{/logout}" class="btn btn-outline-danger w-100">
                                <i class="fas fa-sign-out-alt me-2"></i>Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-4" style="font-family: 'Playfair Display', serif;">
                            <i class="fas fa-user me-2"></i>Profile Information
                        </h4>

                        <form th:action="@{/profile/update}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" th:value="${user.firstName}" name="firstName">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" th:value="${user.lastName}" name="lastName">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:value="${user.email}" readonly>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control" th:value="${user.phone}" name="phone">
                            </div>

                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Update Profile
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
    </script>
</body>
</html>
