<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <title>Access Denied - BookNest</title>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                    <div class="card-body">
                        <div class="mb-4 text-danger">
                            <i class="fas fa-user-shield fa-5x"></i>
                        </div>
                        <h1 class="display-4 fw-bold text-dark mb-3" style="font-family: 'Playfair Display', serif;">403 Access Denied</h1>
                        <h5 class="text-secondary mb-4">You do not have permission to access this area.</h5>
                        <p class="text-muted mb-4">
                            The page you are trying to access requires <strong>Administrator (ROLE_ADMIN)</strong> privileges. If you believe this is a mistake, please contact the site administrator.
                        </p>
                        <div class="d-flex justify-content-center gap-3">
                            <a th:href="@{/}" class="btn btn-primary btn-lg px-4 rounded-pill">
                                <i class="fas fa-home me-2"></i>Back to Home
                            </a>
                            <a th:href="@{/books}" class="btn btn-outline-secondary btn-lg px-4 rounded-pill">
                                <i class="fas fa-book me-2"></i>Browse Books
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
