<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-lg-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/profile}">Profile</a></li>
                        <li class="breadcrumb-item active" aria-current="page">My Orders</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="text-center mb-5" data-aos="fade-up">
            <h1 class="section-title">My Orders</h1>
            <p class="text-muted">Track and manage your order history</p>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${orders == null or orders.empty}">
            <div class="text-center py-5" data-aos="fade-up">
                <i class="fas fa-shopping-bag fa-4x text-muted mb-3"></i>
                <h4>No orders placed yet</h4>
                <p class="text-muted">Explore our collection and place your first order today!</p>
                <a th:href="@{/books}" class="btn btn-primary">
                    <i class="fas fa-book me-2"></i>Browse Books
                </a>
            </div>
        </div>

        <div class="row g-4" th:if="${orders != null and !orders.empty}">
            <div class="col-lg-12" th:each="order : ${orders}" data-aos="fade-up">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="row align-items-center g-3">
                            <div class="col-md-3">
                                <h6 class="fw-bold mb-1 text-primary" th:text="${order.orderNumber != null ? order.orderNumber : 'ORD-' + order.id}"></h6>
                                <small class="text-muted" th:text="${#temporals.format(order.createdAt, 'MMM dd, yyyy - hh:mm a')}"></small>
                            </div>
                            <div class="col-md-3">
                                <span class="badge px-3 py-2 fs-6" 
                                      th:classappend="${order.status == 'DELIVERED' ? 'bg-success' : (order.status == 'CANCELLED' ? 'bg-danger' : (order.status == 'SHIPPED' ? 'bg-primary' : (order.status == 'PROCESSING' ? 'bg-info text-dark' : 'bg-warning text-dark')))}"
                                      th:text="${order.status}"></span>
                                <br>
                                <small class="text-muted" th:text="'Payment: ' + ${order.paymentStatus}"></small>
                            </div>
                            <div class="col-md-2">
                                <span class="fw-bold fs-5" th:text="'₹' + ${order.finalAmount}"></span>
                                <br>
                                <small class="text-muted" th:text="${order.totalItems} + ' item(s)'"></small>
                            </div>
                            <div class="col-md-4 text-md-end d-flex justify-content-md-end gap-2">
                                <a th:href="@{/profile/order/{id}(id=${order.id})}" class="btn btn-outline-primary btn-sm">
                                    <i class="fas fa-eye me-1"></i>View Details
                                </a>
                                <form th:if="${order.status == 'PENDING' or order.status == 'PROCESSING'}" 
                                      th:action="@{/profile/order/{id}/cancel(id=${order.id})}" method="post" 
                                      onsubmit="return confirm('Are you sure you want to cancel this order? Stock will be restored.');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">
                                        <i class="fas fa-times-circle me-1"></i>Cancel
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
    </script>
</body>
</html>
