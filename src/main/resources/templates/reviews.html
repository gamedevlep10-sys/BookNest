<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-lg-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/profile}">Profile</a></li>
                        <li class="breadcrumb-item active" aria-current="page">My Reviews</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="text-center mb-5" data-aos="fade-up">
            <h1 class="section-title">My Reviews</h1>
            <p class="text-muted">Reviews you've written</p>
        </div>

        <div th:if="${reviews == null or reviews.empty}">
            <div class="text-center py-5" data-aos="fade-up">
                <i class="fas fa-star fa-4x text-muted mb-3"></i>
                <h4>No reviews yet</h4>
                <p class="text-muted">Share your thoughts about books you've read</p>
                <a th:href="@{/books}" class="btn btn-primary">
                    <i class="fas fa-book me-2"></i>Browse Books
                </a>
            </div>
        </div>

        <div class="row g-4" th:if="${reviews != null and !reviews.empty}">
            <div class="col-lg-12" th:each="review : ${reviews}" data-aos="fade-up">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="row align-items-start">
                            <div class="col-md-2 mb-3">
                                <img th:src="${review.book.imageUrl}" class="rounded" width="80" height="110" style="object-fit: cover;">
                            </div>
                            <div class="col-md-10">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div>
                                        <h6 class="fw-bold mb-1" th:text="${review.book.title}"></h6>
                                        <small class="text-muted" th:text="${review.book.author.name}"></small>
                                    </div>
                                    <div class="review-stars">
                                        <i class="fas fa-star" th:if="${review.rating >= 1}"></i>
                                        <i class="far fa-star" th:if="${review.rating < 1}"></i>
                                        <i class="fas fa-star" th:if="${review.rating >= 2}"></i>
                                        <i class="far fa-star" th:if="${review.rating < 2}"></i>
                                        <i class="fas fa-star" th:if="${review.rating >= 3}"></i>
                                        <i class="far fa-star" th:if="${review.rating < 3}"></i>
                                        <i class="fas fa-star" th:if="${review.rating >= 4}"></i>
                                        <i class="far fa-star" th:if="${review.rating < 4}"></i>
                                        <i class="fas fa-star" th:if="${review.rating >= 5}"></i>
                                        <i class="far fa-star" th:if="${review.rating < 5}"></i>
                                    </div>
                                </div>
                                <p class="text-muted mb-2" th:text="${review.comment}"></p>
                                <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'MMM dd, yyyy')}"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
    </script>
</body>
</html>
